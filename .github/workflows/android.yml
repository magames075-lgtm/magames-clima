name: APK Android (Capacitor)
on:
  workflow_dispatch:
    inputs:
      completo:
        description: 'Bateria completa (26/30/34) em vez do teste curto da Janela no 34'
        type: boolean
        default: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Montar www e projeto Android
        working-directory: capacitor
        run: |
          mkdir -p www
          cp -r ../index.html ../app.js ../style.css ../manifest.webmanifest ../icons ../vendor www/
          npm install --no-audit --no-fund
          npx cap add android
          ./patch-android.sh
          npx cap sync android
          ls -la android/app/src/main/assets/public android/app/src/main/assets/public/vendor/maplibre
          test -s android/app/src/main/assets/public/vendor/maplibre/maplibre-gl.js
          grep -q 'Janela da sua casa' android/app/src/main/assets/public/index.html
          grep -q '__v13' android/app/src/main/assets/public/app.js
          grep -rn "ic_launcher" android/app/src/main/res/mipmap-anydpi-v26/
      - name: Compilar APK release (sem assinatura; assinatura feita fora do GitHub) e debug (so para o teste)
        working-directory: capacitor/android
        run: |
          ./gradlew assembleRelease --no-daemon -q
          # copia de DEBUG so para o teste no emulador: liga a depuracao da WebView apenas nela
          sed -i 's/"webContentsDebuggingEnabled": false/"webContentsDebuggingEnabled": true/' app/src/main/assets/capacitor.config.json
          grep webContentsDebuggingEnabled app/src/main/assets/capacitor.config.json
          ./gradlew assembleDebug --no-daemon -q
      - uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned
          path: capacitor/android/app/build/outputs/apk/release/*.apk
      - name: Copia de TESTE do release (chave descartavel)
        working-directory: capacitor
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore t.jks -alias t -keyalg RSA -keysize 2048 -validity 100 -storepass testtest -keypass testtest -dname CN=test
          $BT/zipalign -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk a.apk
          $BT/apksigner sign --ks t.jks --ks-pass pass:testtest --out release-test.apk a.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk debug-test.apk
          mkdir -p ../testapk && cp release-test.apk debug-test.apk ../testapk/
          $BT/aapt dump badging release-test.apk | grep -E "package|uses-permission|application-label|launchable" | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: testapk/*.apk
  emulador:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.completo && 75 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.completo && '[26,30,34]' || '[34]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: test-apks, path: capacitor }
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Testes no emulador Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          working-directory: capacitor
          script: ${{ inputs.completo && './ci-emulator.sh' || './ci-janela.sh' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emu-api${{ matrix.api }}
          path: capacitor/out
